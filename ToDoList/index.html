<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="todo-card">

            <h1>My To-Do List</h1>
            <p class="subtitle">Manage your daily tasks</p>

            <!-- Add Task -->
            <div class="task-input">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter a new task..."
                    autocomplete="off"
                >

                <button id="addTaskBtn">
                    Add Task
                </button>
            </div>

            <!-- Filters -->
            <div class="filters">

                <button class="filter-btn active" data-filter="all">
                    All
                </button>

                <button class="filter-btn" data-filter="active">
                    Active
                </button>

                <button class="filter-btn" data-filter="completed">
                    Completed
                </button>

            </div>

            <!-- Task List -->
            <ul id="taskList"></ul>

            <!-- Empty Message -->
            <p id="emptyMessage">
                No tasks available.
            </p>

            <!-- Task Statistics -->
            <div class="task-stats">

                <span id="taskCount">
                    0 tasks
                </span>

                <button id="clearCompleted">
                    Clear Completed
                </button>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
